version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-gemini-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    # Uncomment to use env_file instead
    # env_file:
    #   - .env
